name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  engine:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and version
        run: test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build, validate and publish the ARM64 Engine image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          registry_image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/mdd-sim-gateway-engine"
          runtime_fp=$(sh tools/engine-fingerprint.sh runtime)
          base_fp=$(sh tools/engine-fingerprint.sh base)
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --no-cache --platform linux/arm64 \
            --build-arg "MDD_VERSION=$(cat VERSION)" \
            --build-arg "RUNTIME_FP=$runtime_fp" \
            --build-arg "BASE_FP=$base_fp" \
            -t "$registry_image:${GITHUB_REF_NAME}" \
            -t "$registry_image:${GITHUB_REF_NAME}-arm64" engine
          docker run --rm --entrypoint /bin/bash "$registry_image:${GITHUB_REF_NAME}" -lc '
            set -e
            test "$(uname -m)" = aarch64
            test "$(find /usr/lib/asterisk/modules -name "*.so" | wc -l)" -eq 334
            python3 -c "import Crypto, cryptography, jinja2, panoramisk, requests, serial, smartcard, socks, card"
            asterisk -V
          '
          docker push "$registry_image:${GITHUB_REF_NAME}"
          docker push "$registry_image:${GITHUB_REF_NAME}-arm64"
          engine_archive="mdd-sim-gateway-engine-${GITHUB_REF_NAME}-arm64.tar"
          docker save --output "$engine_archive" "$registry_image:${GITHUB_REF_NAME}"
          gzip -1 "$engine_archive"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-image
          path: mdd-sim-gateway-engine-v*-arm64.tar.gz
          compression-level: 0
          if-no-files-found: error

  engine-amd64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify tag and version
        run: test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
      - name: Build, validate and publish the amd64 Engine image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          registry_image="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/mdd-sim-gateway-engine"
          runtime_fp=$(sh tools/engine-fingerprint.sh runtime)
          base_fp=$(sh tools/engine-fingerprint.sh base)
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --no-cache --platform linux/amd64 \
            --build-arg "MDD_VERSION=$(cat VERSION)" \
            --build-arg "RUNTIME_FP=$runtime_fp" \
            --build-arg "BASE_FP=$base_fp" \
            -t "$registry_image:${GITHUB_REF_NAME}-amd64" \
            -t "$registry_image:${GITHUB_REF_NAME}" engine
          docker run --rm --entrypoint /bin/bash "$registry_image:${GITHUB_REF_NAME}-amd64" -lc '
            set -e
            test "$(uname -m)" = x86_64
            test "$(find /usr/lib/asterisk/modules -name "*.so" | wc -l)" -eq 334
            python3 -c "import Crypto, cryptography, jinja2, panoramisk, requests, serial, smartcard, socks, card"
            asterisk -V
          '
          test "$(docker image inspect "$registry_image:${GITHUB_REF_NAME}-amd64" --format '{{.Architecture}}')" = amd64
          # Do not push :vX.Y.Z from this job — that tag stays the ARM64 image for
          # existing ARM64 installs. amd64 hosts load the -amd64 Release asset.
          docker push "$registry_image:${GITHUB_REF_NAME}-amd64"
          engine_archive="mdd-sim-gateway-engine-${GITHUB_REF_NAME}-amd64.tar"
          docker save --output "$engine_archive" "$registry_image:${GITHUB_REF_NAME}"
          gzip -1 "$engine_archive"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: engine-image-amd64
          path: mdd-sim-gateway-engine-v*-amd64.tar.gz
          compression-level: 0
          if-no-files-found: error

  package:
    needs: [engine, engine-amd64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify tag and version
        run: |
          test "v$(tr -d '\n' < VERSION)" = "${GITHUB_REF_NAME}"
          git diff --exit-code
      - name: No real subscriber identifiers in the release
        run: sh tools/check-subscriber-identifiers.sh
      - name: Test release source
        run: |
          sudo apt-get update
          sudo apt-get install -y swig libpcsclite-dev
          python -m pip install -r control/requirements.txt
          python -m py_compile control/app/*.py control/app/routers/*.py engine/*.py host/*.py
          python -m unittest discover -s tests -v
          sh -n install.sh engine/entrypoint.sh tools/engine-fingerprint.sh host/engine_images.py
          cd webui
          npm ci
          npm audit --audit-level=high
          npm run build
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build ARM64 and amd64 control image assets and validate Engine definition
        run: |
          image_tar="mdd-sim-gateway-control-${GITHUB_REF_NAME}-arm64.tar"
          docker buildx build --platform linux/arm64 \
            --build-arg "MDD_VERSION=$(cat VERSION)" \
            -f control/Dockerfile \
            -t mdd-sim-gateway/control \
            -t "mdd-sim-gateway/control:${GITHUB_REF_NAME}" \
            --output "type=docker,dest=${image_tar}" .
          gzip -1 "$image_tar"
          amd64_tar="mdd-sim-gateway-control-${GITHUB_REF_NAME}-amd64.tar"
          docker build --platform linux/amd64 \
            --build-arg "MDD_VERSION=$(cat VERSION)" \
            -f control/Dockerfile \
            -t mdd-sim-gateway/control:amd64 \
            -t "mdd-sim-gateway/control:${GITHUB_REF_NAME}-amd64" .
          test "$(docker image inspect mdd-sim-gateway/control:amd64 --format '{{.Architecture}}')" = amd64
          docker save --output "$amd64_tar" mdd-sim-gateway/control:amd64
          gzip -1 "$amd64_tar"
          # The native engine jobs perform the clean build and publish it to GHCR.
          # Keep this cheap parser check here so packaging also rejects a malformed definition.
          docker build --check -f engine/Dockerfile engine
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engine-image
          path: .
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: engine-image-amd64
          path: .
      - name: Build checksummed source archive
        run: |
          archive="mdd-sim-gateway-${GITHUB_REF_NAME}.tar.gz"
          staging="$(mktemp -d)"
          root="$staging/mdd-sim-gateway-${GITHUB_REF_NAME}"
          mkdir -p "$root"
          git archive HEAD | tar -x -C "$root"
          rm -rf "$root/webui/dist"
          cp -a webui/dist "$root/webui/dist"
          printf '%s\n' "$(cat VERSION)" > "$root/webui/dist/.mdd-release-version"
          # v1.3.4's updater requires this legacy channel marker before it will apply an
          # archive. Generate it only for the hand-off release; the new installer removes it.
          if [ "$(cat VERSION)" = "1.3.5" ]; then
            printf '%s\n' public > "$root/EDITION"
          fi
          # v1.4.1's updater predates distributed Engine assets, but it invokes this release's
          # install.sh after verifying and applying the source archive. This checksum gives that
          # installer a trusted one-time handoff into the same proxied Release asset channel.
          # The handoff filename stays ARM64-only so the old updater cannot import amd64.
          sha256sum "mdd-sim-gateway-engine-${GITHUB_REF_NAME}-arm64.tar.gz" \
            > "$root/engine/release-image.SHA256SUMS"
          tar -czf "$archive" -C "$staging" "mdd-sim-gateway-${GITHUB_REF_NAME}"
          sha256sum "$archive" \
            "mdd-sim-gateway-control-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-control-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-sim-gateway-engine-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-engine-${GITHUB_REF_NAME}-amd64.tar.gz" > SHA256SUMS
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "mdd-sim-gateway-${GITHUB_REF_NAME}.tar.gz" \
            "mdd-sim-gateway-control-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-control-${GITHUB_REF_NAME}-amd64.tar.gz" \
            "mdd-sim-gateway-engine-${GITHUB_REF_NAME}-arm64.tar.gz" \
            "mdd-sim-gateway-engine-${GITHUB_REF_NAME}-amd64.tar.gz" \
            SHA256SUMS \
            --verify-tag --generate-notes --title "MDD Sim Gateway ${GITHUB_REF_NAME}"
